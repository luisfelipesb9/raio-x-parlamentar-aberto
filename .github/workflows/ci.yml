name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      RAIO_X_ID_SALT: sal-somente-para-testes  # sal de TESTE, não é segredo
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python -m scripts.checa_pii

  gitleaks:
    runs-on: ubuntu-latest
    # a gitleaks-action lista os commits do PR pela API: sem pull-requests: read, o evento pull_request dá 403
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Em repositório de ORGANIZAÇÃO, a gitleaks-action exige a secret GITLEAKS_LICENSE
      # (gratuita para uso aberto; ver gitleaks.com). Em conta pessoal não é necessária.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # descomente se o repo for de uma organização

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6  # a versão vem do campo packageManager de web/package.json
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # O que um buscador/robô de IA recebe SEM JavaScript: SSR da ficha, 404 real, robots, sitemap,
  # llms.txt e JSON-LD. Usa só o banco de DEMONSTRAÇÃO FICTÍCIO (sem rede, sem dado real).
  seo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run python -m scripts.seed_demo
      - uses: pnpm/action-setup@v6  # a versão vem do campo packageManager de web/package.json
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # sobe a API (sal PÚBLICO da demo, não é segredo), roda `pnpm build` com ela no ar,
      # sobe `next start` e confere por HTTP puro; mata os dois processos no fim
      - run: uv run python -m scripts.seo_smoke --build --site-publico https://exemplo.test
