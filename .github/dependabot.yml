# Atualizações de dependências. Política e vereditos: docs/operacao-github.md (seção "Dependências").
# - Semanal, poucos PRs abertos por ecossistema e agrupados para não afogar 2 mantenedores.
# - Majors de typescript, @types/node e @playwright/test ficam de fora: revisão manual
#   (@types/node acompanha o Node do .nvmrc; TS major muda opções do tsconfig; Playwright troca o navegador).
# - O rótulo `dependencias` precisa existir no repositório (scripts/gh_publicar.sh cria).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    labels: [dependencias]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:  # todas as actions num único PR
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels: [dependencias]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      npm-dev-minor-patch:  # dev-deps minor/patch num grupo só (lint, test e build no CI)
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          - "@playwright/test"  # minor do Playwright troca o navegador: PR próprio
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    labels: [dependencias]
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-minor-patch:
        update-types: [minor, patch]
