[project]
name = "raio-x-parlamentar"
version = "0.1.0"
description = "Sistema especialista que documenta dados públicos de deputados federais e correlaciona as informações num grafo navegável, com nível de certeza e fonte oficial em cada conclusão."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Luís Felipe Silva Barbosa" },
  { name = "Pedro Rodrigues Mesquita" },
]
keywords = ["transparência", "dados abertos", "câmara dos deputados", "sistema especialista", "grafo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "duckdb>=1.0",
  "httpx>=0.27",
  "fastapi>=0.165.0",
  "uvicorn>=0.54.0",
  # O Windows não traz o banco de fusos IANA; o DuckDB exige (America/Sao_Paulo).
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
