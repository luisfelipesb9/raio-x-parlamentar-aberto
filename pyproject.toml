[project]
name = "raio-x-parlamentar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "duckdb>=1.0",
  "httpx>=0.27",
  "fastapi>=0.165.0",
  "uvicorn>=0.54.0",
  # O Windows não traz o banco de fusos IANA; o DuckDB exige (America/Sao_Paulo).
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
